<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso Completo: Governança de TI, Segurança e Gestão de Acessos (Módulos 1 a 4 + Prova Final) | Sistema Cresol</title>
  <link rel="stylesheet" href="css/cresol-scorm.css">
  <script src="https://player.pandavideo.com.br/api.v2.js" async></script>
</head>
<body>

  <!-- Cabeçalho Institucional Cresol (Fundo Branco Prioritário + Endossamento Lateral Oficial) -->
  <header class="cresol-header">
    <div class="brand-lockup">
      <button type="button" id="mobile-menu-toggle" class="mobile-menu-btn" aria-label="Abrir menu de aulas">
        <span>☰ Menu</span>
      </button>
      <img src="assets/cresol-logo.svg" alt="Cresol" class="brand-logo">
      <span class="brand-endorsement-divider" aria-hidden="true"></span>
      <span class="brand-endorsement-text">GOVERNANÇA DE TI, SEGURANÇA E GESTÃO DE ACESSOS</span>
    </div>

    <div class="header-controls">
      <button type="button" id="btn-open-glossary" class="glossary-header-btn" title="Consultar siglas e termos da trilha (CIDA, PAM, Zero Trust, Colmeia, Sentinela...)">
        <span>📖 Glossário Rápido</span>
      </button>

      <div class="module-progress-pill" title="Progresso total no curso">
        <span class="module-progress-label">Progresso</span>
        <div class="module-progress-bar-wrap">
          <div id="header-progress-fill" class="module-progress-bar-fill" style="width: 0%;"></div>
        </div>
        <span id="header-progress-pct" class="module-progress-pct">0%</span>
      </div>


    </div>
  </header>

  <!-- Layout Principal: Trilha Lateral + Palco da Aula / Quiz / Prova Final -->
  <div class="app-layout">
    <aside id="course-sidebar" class="course-sidebar" aria-label="Conteúdo do Curso">
      <div class="sidebar-banner">
        
        <h2 class="sidebar-module-title">Governança de TI, Segurança e Acessos</h2>
      </div>

      <div class="sidebar-section-header">
        <span>Trilha de Aprendizagem</span>
        <span id="sidebar-completed-counter">0 de 21 aulas</span>
      </div>

      <ul id="sidebar-lesson-list" class="lesson-list" role="list"></ul>

      <div class="sidebar-footer">
        <span>Sistema Cresol • Educação Corporativa</span>
        <img src="assets/cresol-symbol.svg" alt="" style="height: 18px; width: auto;">
      </div>
    </aside>

    <main class="main-stage" id="main-stage-content" role="main"></main>
  </div>

  <!-- Drawer Lateral do Glossário Rápido Interativo -->
  <div id="glossary-backdrop" class="glossary-backdrop" aria-hidden="true"></div>
  <aside id="glossary-drawer" class="glossary-drawer" aria-label="Glossário Rápido da Trilha">
    <div class="glossary-drawer-header">
      <div>
        <div style="font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:#FFD9B8;margin-bottom:2px;">Consulta Rápida • Sistema Cresol</div>
        <h2 style="font-size:18px;font-weight:800;">Glossário de Governança &amp; Segurança</h2>
      </div>
      <button type="button" id="btn-close-glossary" class="glossary-close-btn" aria-label="Fechar glossário">✕</button>
    </div>
    <div class="glossary-search-box">
      <input type="search" id="glossary-search-input" class="glossary-search-input" placeholder="Buscar sigla ou conceito (ex: CIDA, PAM, Zero Trust, Sentinela, Break-Glass)...">
    </div>
    <div id="glossary-items-list" class="glossary-list"></div>
  </aside>

  <!-- Notificação Flutuante -->
  <div id="cresol-toast" class="toast-notification" role="status" aria-live="polite">
    <img src="assets/cresol-symbol.svg" alt="" style="height: 20px; width: auto;">
    <span id="cresol-toast-text">Progresso atualizado!</span>
  </div>

  <!-- Caderno Formatado para Impressão / Exportação em PDF -->
  <section id="print-notebook-container" class="print-only-notebook" aria-hidden="true"></section>

  <script src="js/course-data.js"></script>
  <script src="js/scorm-api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
